name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Keep the existing Pages project as the safe default. The repository
      # variable can still override it for an intentional future migration.
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'postal-label-service' }}
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Validate Cloudflare deployment configuration
        shell: bash
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing GitHub Secret::CLOUDFLARE_API_TOKEN Secret is required for Cloudflare Pages deployment."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing GitHub Secret::CLOUDFLARE_ACCOUNT_ID Secret is required for Cloudflare Pages deployment."
            missing=1
          fi
          if [ -z "$PAGES_PROJECT" ]; then
            echo "::error title=Missing Pages project::Set CLOUDFLARE_PAGES_PROJECT to the existing Cloudflare Pages project name."
            missing=1
          fi
          exit "$missing"

      - name: Deploy to Cloudflare Pages
        # Forked pull requests cannot access repository secrets; they still run tests and build.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name "$PAGES_PROJECT" --branch "$DEPLOY_BRANCH"
